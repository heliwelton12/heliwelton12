name: Generate profile visuals

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#20F68D&color_dots=#EBEDF0,#0EA5E9,#14B8A6,#20F68D,#A7F3D0
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#20F68D&color_dots=#161B22,#0EA5E9,#14B8A6,#20F68D,#A7F3D0

      - name: Refine snake for profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("dist").glob("github-contribution-grid-snake*.svg"):
              svg = path.read_text(encoding="utf-8")
              svg = re.sub(r'<rect class="u [^"]*"[^>]*/>', "", svg)
              svg = svg.replace(
                  'viewBox="-16 -32 880 192" width="880" height="192"',
                  'viewBox="-16 -24 880 144" width="880" height="144"'
              )
              path.write_text(svg, encoding="utf-8")
          PY

      - name: Generate GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          owner = os.environ["GH_OWNER"]

          def request(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "github-profile-stats"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8")
                  return json.loads(body), dict(response.headers)

          repos, _ = request(
              f"https://api.github.com/users/{urllib.parse.quote(owner)}/repos?per_page=100&type=owner"
          )

          public_repos = len(repos)
          owned_repos = [repo for repo in repos if not repo.get("fork")]
          stars = sum(int(repo.get("stargazers_count", 0)) for repo in owned_repos)

          total_commits = 0
          language_bytes = {}

          for repo in owned_repos:
              name = repo["name"]

              try:
                  commits, headers = request(
                      f"https://api.github.com/repos/{urllib.parse.quote(owner)}/{urllib.parse.quote(name)}/commits"
                      f"?author={urllib.parse.quote(owner)}&per_page=1"
                  )

                  link = headers.get("Link") or headers.get("link") or ""
                  match = re.search(r'[?&]page=(\d+)>; rel="last"', link)

                  if match:
                      total_commits += int(match.group(1))
                  elif isinstance(commits, list) and commits:
                      total_commits += 1
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  pass

              try:
                  languages, _ = request(
                      f"https://api.github.com/repos/{urllib.parse.quote(owner)}/{urllib.parse.quote(name)}/languages"
                  )
                  for language, size in languages.items():
                      language_bytes[language] = language_bytes.get(language, 0) + int(size)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  pass

          top_languages = [
              language
              for language, _ in sorted(
                  language_bytes.items(),
                  key=lambda item: item[1],
                  reverse=True
              )[:5]
          ]

          language_text = " • ".join(top_languages) if top_languages else "Dados sendo atualizados"

          def make_svg(dark):
              bg = "#0D1117" if dark else "#FFFFFF"
              border = "#30363D" if dark else "#D0D7DE"
              text = "#F0F6FC" if dark else "#1F2328"
              muted = "#8B949E" if dark else "#59636E"
              card = "#161B22" if dark else "#F6F8FA"
              cyan = "#0EA5E9"
              green = "#20F68D"

              title = "GitHub em números"
              languages = html.escape(language_text)

              return f'''<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Estatísticas do GitHub">
                <rect x="1" y="1" width="898" height="238" rx="18" fill="{bg}" stroke="{border}"/>
                <text x="40" y="45" fill="{text}" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">{title}</text>

                <g font-family="Segoe UI, Arial, sans-serif">
                  <rect x="40" y="70" width="190" height="92" rx="14" fill="{card}" stroke="{border}"/>
                  <text x="58" y="103" fill="{muted}" font-size="14">COMMITS PÚBLICOS</text>
                  <text x="58" y="142" fill="{cyan}" font-size="30" font-weight="700">{total_commits}</text>

                  <rect x="250" y="70" width="190" height="92" rx="14" fill="{card}" stroke="{border}"/>
                  <text x="268" y="103" fill="{muted}" font-size="14">REPOSITÓRIOS</text>
                  <text x="268" y="142" fill="{green}" font-size="30" font-weight="700">{public_repos}</text>

                  <rect x="460" y="70" width="190" height="92" rx="14" fill="{card}" stroke="{border}"/>
                  <text x="478" y="103" fill="{muted}" font-size="14">STARS RECEBIDAS</text>
                  <text x="478" y="142" fill="{cyan}" font-size="30" font-weight="700">{stars}</text>

                  <rect x="670" y="70" width="190" height="92" rx="14" fill="{card}" stroke="{border}"/>
                  <text x="688" y="103" fill="{muted}" font-size="14">PROJETOS PRÓPRIOS</text>
                  <text x="688" y="142" fill="{green}" font-size="30" font-weight="700">{len(owned_repos)}</text>

                  <text x="40" y="196" fill="{muted}" font-size="14">LINGUAGENS MAIS PRESENTES</text>
                  <text x="40" y="222" fill="{text}" font-size="17" font-weight="600">{languages}</text>
                </g>
              </svg>'''

          Path("dist").mkdir(parents=True, exist_ok=True)
          Path("dist/github-stats-dark.svg").write_text(make_svg(True), encoding="utf-8")
          Path("dist/github-stats-light.svg").write_text(make_svg(False), encoding="utf-8")
          PY

      - name: Publish profile visuals to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
